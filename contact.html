<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Contact Hereafter </title>
  <link rel="stylesheet" href="/style1.css" webc:keep>
</head>

<body>
  <t-header></t-header>
  <div id="contact-form">
    <div class="contact-here">
      <h1>Contact Us</h1>
    </div>
    <form id="form-container">
      <div id="row">
        <div class="form-group">
          <label> Name: </label>
          <input type="text" placeholder="Juan D. Dela Cruz">

          <label> Email: </label>
          <input type="email" placeholder="john.doe@example.com">

          <label> Birthdate: </label>
          <input type="date">
        </div>

        <div class="form-group">
          <label> Age: </label>
          <input type="number">

          <label> Phone: </label>
          <input type="tel" placeholder="+63 9XX XXX XXXX">

          <label> Topic: </label>
          <select>
            <option>Select a Topic</option>
            <option>General Inquiry</option>
            <option>Feedback</option>
            <option>Support</option>
            <option>Event & Private Dining</option>
            <option>Partnership</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div id="message-section">
        <label> Message: </label>
        <textarea placeholder="Write your message here..."></textarea>

        <div id="section">
          <div id="SocialMedia">
            <a href="https://www.facebook.com/hereafteriloilocity" class="fb"> <img src="images/FBlogo.png"
                alt="Facebook" width="30" height="30">Facebook </a>
            <a
              href="https://www.instagram.com/hereafter_2023?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==">
              <img src="images/IGlogo.png" alt="Instagram" width="30" height="30">Instagram </a>
          </div>

          <div id="Infos">
            <div class="info-item">
              <p> <strong>Email</strong> </p>
              <p> hereafter@gmail.com </p>
            </div>

            <div class="info-item">
              <p> <strong>Phone</strong> </p>
              <p> +63 917 889 0160 </p>
            </div>

            <div class="info-item">
              <p> <strong>Address</strong> </p>
              <p> Ground Floor, St. Anne Building, Luna St., La Paz, Iloilo City, 5000 </p>
            </div>
          </div>
        </div>

        <div id="button-group">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </div>
      </div>
    </form>
</body>

</html>
